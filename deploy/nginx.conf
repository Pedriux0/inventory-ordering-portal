# NGINX site for the inventory portal (proposal: "Preliminary Deployment Research")
# - serves the React build as static files
# - forwards /api/* to the Express app that PM2 keeps running on port 3000
# copy to /etc/nginx/sites-available/inventory-portal and replace YOUR_DOMAIN
server {
    listen 80;
    server_name YOUR_DOMAIN;

    root /var/www/inventory-portal/client/dist;
    index index.html;

    # api calls go to express, the real client ip is passed along for the audit logs
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # react router: any unknown path loads index.html and react shows the right page
    location / {
        try_files $uri /index.html;
    }

    # basic hardening headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy same-origin;
}
